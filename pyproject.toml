[project]
name = "jevsnips"
version = "0.1.0"
description = "Evaluation of TypeSafe AI's Jev on the SNIPS NLU benchmark, without training."
readme = "README.md"
authors = [{ name = "Will Rice", email = "wrice20@gmail.com" }]
requires-python = ">=3.13"
dependencies = [
  "huggingface-hub>=2.1.1",
  "pre-commit>=4.6.2",
  "pydantic>=2.13.5",
  "pydocstyle>=6.3.0",
  "pytest>=9.1.1",
  "python-dotenv>=1.2.3",
  "ruff>=0.16.8",
  "scikit-learn>=1.9.1",
  "scipy>=1.18.1",
  "seqeval>=1.2.2",
  "tqdm>=4.70.1",
  "ty>=0.0.83",
  "typesafe-sdk>=0.7.2",
]

[build-system]
requires = ["uv_build>=0.12.18"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["jevsnips"]

[tool.ruff.lint.isort]
known-first-party = ["jevsnips"]

[tool.ruff.lint]
select = ["C", "E", "F", "I", "W", "D", "N", "B", "PTH", "ANN"]
ignore = ["D107"]
exclude = [".venv"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[project.scripts]
run = "jevsnips.scripts.run:main"
report = "jevsnips.scripts.report:main"
